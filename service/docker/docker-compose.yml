services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: hello-fastapi
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - TZ=Asia/Shanghai
      - DATABASE_URL=postgresql+asyncpg://hello_fastapi:hello_fastapi_pass@db:5432/hello_fastapi
      - REDIS_URL=redis://redis:6379/0
      # 密钥必须显式提供（缺少时 compose 直接报错，应用内也有生产 fail-fast 校验）
      - SECRET_KEY=${SECRET_KEY:?请设置 SECRET_KEY 环境变量（openssl rand -hex 32）}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?请设置 JWT_SECRET_KEY 环境变量（openssl rand -hex 32）}
    volumes:
      - ../logs:/app/logs
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - hello-fastapi-net

  db:
    image: postgres:18-alpine
    container_name: hello-fastapi-db
    # PG18 AIO 参数说明：
    # - io_method=worker：io_uring 在容器 seccomp 默认策略下常被禁用，
    #   故选用 worker 进程池实现异步 I/O（PG18 新增 AIO 框架的稳妥选择）；
    # - effective_io_concurrency / maintenance_io_concurrency：AIO 下发深度；
    # - transaction_timeout：事务最大耗时，单位毫秒（PG17+ 新增，30000=30s）；
    # - shared_buffers=512MB：按容器内存 25% 估算（2GB 内存容器）。
    command: >
      postgres -c io_method=worker
               -c effective_io_concurrency=200
               -c maintenance_io_concurrency=200
               -c shared_buffers=512MB
               -c transaction_timeout=30000
    environment:
      - POSTGRES_DB=hello_fastapi
      - POSTGRES_USER=hello_fastapi
      - POSTGRES_PASSWORD=hello_fastapi_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hello_fastapi -d hello_fastapi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hello-fastapi-net

  redis:
    image: redis:7-alpine
    container_name: hello-fastapi-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - hello-fastapi-net

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  hello-fastapi-net:
    name: hello-fastapi-net
    driver: bridge
